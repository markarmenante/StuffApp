<div class="dcell purchase-order-cell">
  <div class="purchase-order-numbers" aria-labelledby="orderNumberLabel">
    {% for order in purchase_orders(category, r['id'] if r and not is_new else none) %}
    <a href="{{ order.url }}" target="_blank" rel="noopener noreferrer"
       title="{{ order.provider }} {{ order.kind }} {{ order.number }}"
       aria-label="Open {{ order.provider }} {{ order.kind }} {{ order.number }}">{{ order.number }}</a>
    {% endfor %}
  </div>
  <span class="clabel" id="orderNumberLabel">Order Number</span>
</div>
